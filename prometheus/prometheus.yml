global:
  scrape_interval: 5s

scrape_configs:
  - job_name: gateway
    static_configs:
      - targets: ['host.docker.internal:3000']
  - job_name: usuarios
    static_configs:
      - targets: ['host.docker.internal:3001']
  - job_name: documentos
    static_configs:
      - targets: ['host.docker.internal:3002']
  - job_name: consultas
    static_configs:
      - targets: ['host.docker.internal:3003']