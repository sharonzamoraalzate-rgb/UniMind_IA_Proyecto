name: CI

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - dir: gateway
            imagen: unimind-gateway
          - dir: microservicio-usuarios
            imagen: unimind-usuarios
          - dir: microservicio-documentos
            imagen: unimind-documentos
          - dir: microservicio-consultas
            imagen: unimind-consultas
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        working-directory: ${{ matrix.dir }}
        run: npm install

      - name: Pruebas básicas
        working-directory: ${{ matrix.dir }}
        run: npm test

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y publicar la imagen
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.dir }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.imagen }}:latest