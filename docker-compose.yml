services:
  db:
    image: postgres:16
    container_name: unimind_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: unimind
      POSTGRES_PASSWORD: unimind123
      POSTGRES_DB: unimind
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata: